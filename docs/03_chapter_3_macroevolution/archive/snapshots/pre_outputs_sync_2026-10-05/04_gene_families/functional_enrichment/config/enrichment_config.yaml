# Enrichment Analysis Configuration File
# Chapter: Macroevolution and Genomics in Velloziaceae
# Execution Date: 2026-09-04

parameters:
  random_seed: 20260904
  n_permutations: 10000
  term_frequency_min_universe_count: 5
  term_frequency_max_universe_fraction: 0.90
  display_min_fg_count: 3
  significance_alpha: 0.05
  odds_ratio_method: "conditional"
  confidence_interval_level: 0.95

contrasts:
  primary:
    - id: "Core_Tier_A_General"
      type: "general"
      description: "Tier A high-confidence core (N=188) vs annotated background universe"
      fg_condition: "Evidence_Tier == 'Tier_A_High_Confidence'"
      bg_universe: "all_annotated_in_category"
    - id: "Cond_Parallel_Exp_DT"
      type: "conditional"
      description: "Preserved parallel expansion in desiccation-tolerant species (N=28) vs Tier A background"
      fg_condition: "Preserved_k3_Parallel_Exp_DT == True and Evidence_Tier == 'Tier_A_High_Confidence'"
      bg_universe: "tier_a_annotated"
    - id: "Cond_Terminal_Exp_Vper"
      type: "conditional"
      description: "Preserved terminal expansion in V. peripherica (N=72) vs Tier A background"
      fg_condition: "Preserved_k3_Exp_Terminal_Vper == True and Evidence_Tier == 'Tier_A_High_Confidence'"
      bg_universe: "tier_a_annotated"
    - id: "Cond_Terminal_Exp_Vtub"
      type: "conditional"
      description: "Preserved terminal expansion in V. tubiflora (N=31) vs Tier A background"
      fg_condition: "Preserved_k3_Exp_Terminal_Vtub == True and Evidence_Tier == 'Tier_A_High_Confidence'"
      bg_universe: "tier_a_annotated"
    - id: "Cond_Terminal_Exp_Xvis"
      type: "conditional"
      description: "Preserved terminal expansion in X. viscosa (N=34) vs Tier A background"
      fg_condition: "Preserved_k3_Exp_Terminal_Xvis == True and Evidence_Tier == 'Tier_A_High_Confidence'"
      bg_universe: "tier_a_annotated"
    - id: "Cond_Parallel_Cont_DT"
      type: "conditional"
      description: "Preserved parallel contraction in desiccation-tolerant species (N=79) vs Tier A background"
      fg_condition: "Preserved_k3_Parallel_Cont_DT == True and Evidence_Tier == 'Tier_A_High_Confidence'"
      bg_universe: "tier_a_annotated"
    - id: "Cond_Ancestral_Exp_Node12"
      type: "conditional"
      description: "Preserved ancestral expansion at Node 12 Core Velloziaceae (N=100) vs Tier A background"
      fg_condition: "Preserved_k3_Exp_Node12 == True and Evidence_Tier == 'Tier_A_High_Confidence'"
      bg_universe: "tier_a_annotated"
    - id: "Cond_Ancestral_Exp_Node13"
      type: "conditional"
      description: "Preserved ancestral expansion at Node 13 Vellozia crown (N=68) vs Tier A background"
      fg_condition: "Preserved_k3_Exp_Node13 == True and Evidence_Tier == 'Tier_A_High_Confidence'"
      bg_universe: "tier_a_annotated"
    - id: "Cond_Ancestral_Exp_Node11"
      type: "conditional"
      description: "Preserved ancestral expansion at Node 11 Velloziaceae crown (N=22) vs Tier A background"
      fg_condition: "Preserved_k3_Exp_Node11 == True and Evidence_Tier == 'Tier_A_High_Confidence'"
      bg_universe: "tier_a_annotated"
  external_controls:
    - id: "Cond_Outgroup_Exp_Ptec"
      type: "conditional"
      description: "Preserved terminal expansion in P. tectorius (N=17) vs Tier A background (External Control)"
      fg_condition: "Preserved_k3_Exp_Terminal_Ptec == True and Evidence_Tier == 'Tier_A_High_Confidence'"
      bg_universe: "tier_a_annotated"
  descriptive_only:
    - id: "Cond_Terminal_Exp_Abra"
      type: "descriptive"
      description: "Preserved terminal expansion in A. bracteata (N=7; reported descriptively due to low N)"
      fg_condition: "Preserved_k3_Exp_Terminal_Abra == True and Evidence_Tier == 'Tier_A_High_Confidence'"
      bg_universe: "tier_a_annotated"

sensitivity_scenarios:
  - id: "scenario_1_all_families"
    description: "All families included without structural or copy number filtering"
    filter: "None"
  - id: "scenario_2_exclude_transposon_high_asymmetry"
    description: "Excluding transposons and extreme single-species copy asymmetry"
    filter: "Flag_Transposon == False and Flag_High_Copy_Asymmetry == False"
  - id: "scenario_3_nuclear_only"
    description: "Restricted to nuclear gene families"
    filter: "Flag_Organellar == False"
  - id: "scenario_4_go_non_iea"
    description: "GO annotations restricted to non-electronic evidence codes (excluding IEA)"
    filter: "Has_Non_IEA == True"
