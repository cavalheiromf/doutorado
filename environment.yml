name: vellozia-genomics
channels:
  - conda-forge
  - bioconda
dependencies:
  # Core Python runtime
  - python>=3.10,<3.13
  - biopython>=1.83
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - matplotlib>=3.8
  - seaborn>=0.13
  - networkx>=3.2
  - statsmodels>=0.14
  - scikit-learn>=1.3
  - pyyaml>=6.0
  - openpyxl>=3.1
  - requests>=2.31
  - pytest>=7.4

  # Bioinformatics tools & CLI runtimes
  - iqtree>=2.2.0
  - hmmer>=3.4
  - mafft>=7.500
  - muscle>=3.8
  - paml>=4.9
  - hyphy>=2.5.50
  - bedtools>=2.31
  - gffread>=0.12
  - pal2nal>=14
  - star>=2.7.10b

  # R & Bioconductor ecosystem (Differential Expression & Heatmaps)
  - r-base>=4.3
  - bioconductor-deseq2>=1.40
  - r-ggplot2>=3.4
  - r-pheatmap>=1.0
  - r-tidyr>=1.3
  - r-dplyr>=1.1

  # Pip-specific dependencies
  - pip
  - pip:
    - python-docx>=1.1.0
